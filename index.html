<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Alejandra ❤️ - Nuestra Galaxia</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* BOTÓN DE INICIO */
        #btn-iniciar {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; border: 2px solid #ff4081; padding: 15px 30px;
            background: rgba(0,0,0,0.9); cursor: pointer; z-index: 100;
            font-family: sans-serif; font-weight: bold; font-size: 18px;
            border-radius: 30px; box-shadow: 0 0 20px rgba(255,64,129,0.5);
        }

        /* TEXTO INFERIOR: TE QUIERO ALEJANDRA */
        #texto-alejandra {
            position: fixed; bottom: 8%; width: 100%; text-align: center;
            color: #ff4081; font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 24px; font-weight: bold; letter-spacing: 3px;
            opacity: 0; transition: opacity 1.5s ease; z-index: 20;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
        }

        /* LUNA Y FOCO */
        #luna {
            position: absolute; top: -150px; right: 10%; width: 120px; height: 120px;
            background: #fff; border-radius: 50%; 
            box-shadow: 0 0 60px #fff, 0 0 120px #4d94ff;
            transition: top 3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2;
        }
        #foco-luna {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0; transition: opacity 2s; z-index: 4; pointer-events: none;
        }

        /* ESCENARIO: PASTO Y CAMINO */
        #escenario {
            position: absolute; bottom: 0; width: 100%; height: 20%;
            background: linear-gradient(to bottom, #051a05 0%, #000 100%);
            z-index: 5;
        }
        .hierba {
            position: absolute; bottom: 100%; width: 2px; height: 10px;
            background: #0a2f0a; border-radius: 2px;
        }

        /* CHICA ANIME (SVG INTERNO) */
        #chica-wrapper {
            position: absolute; bottom: 15%; left: -100px; width: 70px;
            z-index: 10; transition: left 0.1s linear;
        }
        .caminando { animation: balanceo 0.6s infinite ease-in-out; }
        @keyframes balanceo { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

        /* FLORES AMARILLAS */
        .flor {
            position: absolute; width: 10px; height: 10px; background: #ffeb3b;
            border-radius: 50%; box-shadow: 0 0 10px #ffeb3b; z-index: 6;
        }

        /* CORAZÓN MÁGICO */
        #corazon {
            position: absolute; bottom: 35%; right: 15%; font-size: 50px;
            opacity: 0; transform: scale(0.5); transition: all 1s ease;
            filter: drop-shadow(0 0 20px #ff0000); z-index: 10;
        }

        /* ESTRELLAS DE 4 PUNTAS */
        .estrella {
            position: absolute; background: white;
            clip-path: polygon(50% 0%, 54% 46%, 100% 50%, 54% 54%, 50% 100%, 46% 54%, 0% 50%, 46% 46%);
            animation: parpadeo 3s infinite;
        }
        @keyframes parpadeo { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* ESTRELLAS FUGACES */
        .fugaz {
            position: absolute; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
            filter: drop-shadow(0 0 8px white); pointer-events: none; z-index: 3;
        }
    </style>
</head>
<body>

    <button id="btn-iniciar">TOCA PARA INICIAR ❤️</button>
    
    <div id="luna"></div>
    <div id="foco-luna"></div>
    <div id="escenario"></div>
    <div id="corazon">❤️</div>
    
    <!-- Texto inferior personalizado -->
    <div id="texto-alejandra">Te quiero Alejandra</div>

    <div id="chica-wrapper">
        <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 20 Q40 20 35 40 Q30 60 35 80 L30 150 L45 150 L48 180 L52 180 L55 150 L70 150 L65 80 Q70 60 65 40 Q60 20 50 20" fill="#111"/>
            <path d="M35 40 Q50 35 65 40 Q70 70 50 75 Q30 70 35 40" fill="#050505"/>
        </svg>
    </div>

    <canvas id="fuegos-canvas" style="position:fixed; top:0; left:0; pointer-events:none; z-index:15;"></canvas>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const chica = document.getElementById('chica-wrapper');
        const luna = document.getElementById('luna');
        const foco = document.getElementById('foco-luna');
        const corazon = document.getElementById('corazon');
        const textoAlejandra = document.getElementById('texto-alejandra');
        const canvas = document.getElementById('fuegos-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Crear Estrellas y Pasto inicial
        for(let i=0; i<100; i++) {
            const s = document.createElement('div');
            s.className = 'estrella';
            s.style.left = Math.random()*100+'vw';
            s.style.top = Math.random()*100+'vh';
            s.style.width = s.style.height = (Math.random()*4+2)+'px';
            s.style.animationDelay = Math.random()*3+'s';
            document.body.appendChild(s);

            const h = document.createElement('div');
            h.className = 'hierba';
            h.style.left = Math.random()*100+'vw';
            document.getElementById('escenario').appendChild(h);
        }

        // Crear flores amarillas en el suelo
        for(let i=0; i<8; i++) {
            const f = document.createElement('div');
            f.className = 'flor';
            f.style.left = (20 + i*8) + 'vw';
            f.style.bottom = (15 + (Math.random()*3)) + '%';
            document.body.appendChild(f);
        }

        function lanzarFugaz() {
            const f = document.createElement('div');
            f.className = 'fugaz';
            f.style.width = (Math.random()*150 + 50) + 'px';
            f.style.top = Math.random()*40 + 'vh';
            f.style.left = '-200px';
            document.body.appendChild(f);
            
            let pos = -200;
            function move() {
                pos += 12;
                f.style.left = pos + 'px';
                f.style.transform = `rotate(25deg)`;
                if(pos < window.innerWidth + 200) requestAnimationFrame(move);
                else f.remove();
            }
            move();
        }

        // Fuegos Artificiales estilo caricatura
        let particles = [];
        function createFirework(x, y) {
            const colors = ['#ff0055', '#ffeb3b', '#ff00ff', '#00fbff', '#ff5722'];
            const color = colors[Math.floor(Math.random()*colors.length)];
            for(let i=0; i<35; i++) {
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(i) * Math.random()*7,
                    vy: Math.sin(i) * Math.random()*7,
                    life: 1, color: color,
                    size: Math.random()*3 + 2
                });
            }
        }

        function drawFireworks() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.12;
                p.life -= 0.015;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                if(p.life <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(drawFireworks);
        }

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            drawFireworks();

            // Secuencia 1: Alejandra camina
            let posX = -100;
            chica.classList.add('caminando');
            
            let intervalo = setInterval(() => {
                posX += 2;
                chica.style.left = posX + 'px';

                if(posX >= window.innerWidth / 2 - 40) {
                    clearInterval(intervalo);
                    chica.classList.remove('caminando');
                    
                    // Secuencia 2: Aparece la Luna y el foco la ilumina
                    setTimeout(() => {
                        luna.style.top = '10%';
                        setTimeout(() => {
                            foco.style.opacity = '1';
                            foco.style.background = `radial-gradient(circle at ${posX + 35}px 70%, rgba(255,255,255,0.25) 0%, transparent 45%)`;
                            
                            // Secuencia 3: Sigue caminando hacia el corazón y aparece el texto
                            setTimeout(() => {
                                chica.classList.add('caminando');
                                let intervalo2 = setInterval(() => {
                                    posX += 2;
                                    chica.style.left = posX + 'px';
                                    foco.style.background = `radial-gradient(circle at ${posX + 35}px 70%, rgba(255,255,255,0.25) 0%, transparent 45%)`;
                                    
                                    if(posX >= window.innerWidth * 0.65) {
                                        clearInterval(intervalo2);
                                        chica.classList.remove('caminando');
                                        corazon.style.opacity = '1';
                                        corazon.style.transform = 'scale(1.5)';
                                        
                                        // Aparece el mensaje "Te quiero Alejandra" abajo
                                        textoAlejandra.style.opacity = '1';

                                        // Gran Final: Fuegos artificiales
                                        setTimeout(() => {
                                            setInterval(() => {
                                                createFirework(Math.random()*canvas.width, Math.random()*canvas.height*0.5);
                                            }, 600);
                                            setInterval(lanzarFugaz, 1800);
                                        }, 1000);
                                    }
                                }, 20);
                            }, 1500);
                        }, 2000);
                    }, 1000);
                }
            }, 20);
        });
    </script>
</body>
</html>
