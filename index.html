<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Alejandra ❤️ - Nuestra Galaxia</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* BOTÓN DE INICIO */
        #btn-iniciar {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; border: 2px solid #ff4081; padding: 15px 30px;
            background: rgba(0,0,0,0.8); cursor: pointer; z-index: 100;
            font-family: sans-serif; font-weight: bold; font-size: 18px;
            border-radius: 30px; box-shadow: 0 0 20px rgba(255,64,129,0.5);
        }

        /* LUNA Y FOCO */
        #luna {
            position: absolute; top: -150px; right: 10%; width: 120px; height: 120px;
            background: #fff; border-radius: 50%; 
            box-shadow: 0 0 60px #fff, 0 0 120px #4d94ff;
            transition: top 3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2;
        }
        #foco-luna {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0; transition: opacity 2s; z-index: 4; pointer-events: none;
        }

        /* ESCENARIO: PASTO Y CAMINO */
        #escenario {
            position: absolute; bottom: 0; width: 100%; height: 20%;
            background: linear-gradient(to bottom, #051a05 0%, #000 100%);
            z-index: 5;
        }
        .hierba {
            position: absolute; bottom: 100%; width: 2px; height: 10px;
            background: #0a2f0a; border-radius: 2px;
        }

        /* CHICA ANIME (SVG INTERNO) */
        #chica-wrapper {
            position: absolute; bottom: 15%; left: -100px; width: 70px;
            z-index: 10; transition: left 0.1s linear;
        }
        .caminando { animation: balanceo 0.6s infinite ease-in-out; }
        @keyframes balanceo { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

        /* FLORES AMARILLAS */
        .flor {
            position: absolute; width: 10px; height: 10px; background: #ffeb3b;
            border-radius: 50%; box-shadow: 0 0 10px #ffeb3b; z-index: 6;
        }

        /* CORAZÓN MÁGICO */
        #corazon {
            position: absolute; bottom: 32%; right: 15%; font-size: 50px;
            opacity: 0; transform: scale(0.5); transition: all 1s ease;
            filter: drop-shadow(0 0 20px #ff0000); z-index: 10;
        }

        /* ESTRELLAS DE 4 PUNTAS */
        .estrella {
            position: absolute; background: white;
            clip-path: polygon(50% 0%, 54% 46%, 100% 50%, 54% 54%, 50% 100%, 46% 54%, 0% 50%, 46% 46%);
            animation: parpadeo 3s infinite;
        }
        @keyframes parpadeo { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* ESTRELLAS FUGACES TIPO CINE */
        .fugaz {
            position: absolute; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
            filter: drop-shadow(0 0 8px white); pointer-events: none; z-index: 3;
        }
    </style>
</head>
<body>

    <button id="btn-iniciar">TOCA PARA INICIAR ❤️</button>
    
    <!-- AUDIO SPOTIFY / WIDGET DE AMOR -->

    </div>

    <div id="luna"></div>
    <div id="foco-luna"></div>
    <div id="escenario"></div>
    <div id="corazon">❤️</div>

            <path d="M35 40 Q50 35 65 40 Q70 70 50 75 Q30 70 35 40" fill="#050505"/>
        </svg>
    </div>
